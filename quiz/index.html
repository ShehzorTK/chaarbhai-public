<style>
/* Chaar Bhai Paper palette and grain, set in the current landing-page faces: Fraunces (display) and Instrument Sans (text). */
@font-face{font-family:'Fraunces';font-weight:400 700;font-style:normal;font-display:swap;src:url(/quiz/fonts/fraunces.woff2) format('woff2')}

  --ease:cubic-bezier(.16,1,.3,1);
  --tone:sepia(.1) saturate(.94) contrast(.96) brightness(1.02);

}
/* A ground sets every role at once. */
.g-cream{--ink:#F2EBDE;--ink-2:#EBE2D1;--paper:#2A1D0F;--dim:rgba(42,29,15,.8);--line:rgba(42,29,15,.16);--line-2:rgba(42,29,15,.34);--pick:#2B2530;--on-pick:#F2EBDE}

.lk{display:inline-grid;align-content:end;min-height:44px;padding:12px 0 3px;border-bottom:1px solid transparent;text-decoration:none;font:500 15px/1.3 var(--f-serif);letter-spacing:0;cursor:pointer}

.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:58px;padding:0 28px;background:var(--pick);color:var(--on-pick);font:600 16px/1.3 var(--f-serif);letter-spacing:0;text-decoration:none;transition:transform .25s var(--ease),opacity .25s}

.prog{grid-column:1/-1;display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:6px}
.prog i{height:2px;background:var(--line-2);position:relative;overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0;background:var(--paper);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}

main{flex:1;display:flex;flex-direction:column;position:relative}
.scr{flex:1;display:flex;flex-direction:column;padding:8px var(--pad) calc(env(safe-area-inset-bottom) + 24px);max-width:640px;width:100%;margin:0 auto}

@media (hover:hover){.opt:hover{border-color:var(--paper)}}
.opt:active{transform:scale(.985)}
.opt.sel{background:var(--pick);color:var(--on-pick);border-color:var(--pick)}
.opt.sel .k{opacity:1}
.opts.done .opt:not(.sel){opacity:.38;pointer-events:none}

.opts.multi .opt{grid-template-columns:26px 1fr}
.tick{width:20px;height:20px;border:1px solid var(--line-2);display:grid;place-items:center;transition:background-color .2s,border-color .2s}
.tick svg{width:12px;height:12px;stroke:var(--on-pick);fill:none;stroke-width:2;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s var(--ease)}
.opt.sel .tick{background:var(--on-pick);border-color:var(--on-pick)}
.opt.sel .tick svg{stroke:var(--pick);stroke-dashoffset:0}

.react{min-height:3.2em;margin-top:18px;font:italic 400 clamp(23px,6.4vw,28px)/1.2 var(--f-display);letter-spacing:-.015em;opacity:0;transform:translateY(8px);transition:opacity .4s var(--ease),transform .5s var(--ease)}
.react.show{opacity:1;transform:none}

.foot{margin-top:auto;padding-top:14px;position:sticky;bottom:0;background-color:var(--ink);background-image:var(--grain);background-size:400px;border-top:1px solid var(--line);margin-left:calc(var(--pad)*-1);margin-right:calc(var(--pad)*-1);padding-left:var(--pad);padding-right:var(--pad);padding-bottom:calc(env(safe-area-inset-bottom) + 6px)}
.foot .count{text-align:center;font:italic 400 16px/1.3 var(--f-display);color:var(--dim);margin-bottom:10px}

/* intro */
.intro{padding:0;max-width:none;position:relative;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto}
.intro .bar{display:flex;justify-content:center;padding:calc(env(safe-area-inset-top) + 16px) var(--pad) 12px}
.intro .bar img{height:38px}
.hero{position:relative;margin:0 var(--pad);min-height:0;display:grid}
.hero .frame{position:relative;padding:10px;background:#F2EBDE;background-image:var(--grain);background-size:400px;display:grid;transform:rotate(-1.2deg);box-shadow:0 26px 40px -22px rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.25)}
.hero .frame img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;filter:var(--tone);min-height:200px;max-height:46svh}
.hero .stamp{z-index:2;position:absolute;right:4px;bottom:-16px;width:112px;height:112px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;text-align:center;transform:rotate(8deg);box-shadow:0 10px 24px -10px rgba(0,0,0,.5);font:500 10px/1.25 var(--f-serif);letter-spacing:0;}
.hero .stamp b{display:block;font:italic 400 30px/.9 var(--f-display);letter-spacing:0;text-transform:none;margin-bottom:3px}
.intro .copy{padding:34px var(--pad) calc(env(safe-area-inset-bottom) + 22px);max-width:560px;margin:0 auto;width:100%}
.intro h1{font-size:clamp(30px,8.4vw,52px);line-height:1.06;text-wrap:balance}
.intro .sub{margin-top:16px;font-size:16px;line-height:1.5;color:var(--dim);max-width:30em}
.intro .btn{margin-top:22px}

@media (min-width:860px){
  .intro{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:clamp(40px,6vw,96px);padding:0 var(--pad);max-width:1180px;margin:0 auto}
  .intro .bar{grid-column:1/-1;justify-content:flex-start;padding-left:0}
  .hero{grid-column:2;grid-row:2;margin:0 0 40px;align-self:center;max-height:78vh}
  .hero .frame img{object-position:50% 20%}
  .intro .copy{grid-column:1;grid-row:2;align-self:center;padding:0 0 40px;margin:0}
  .intro .btn{max-width:360px}
  .intro .fine{text-align:left}
}

.r-top{padding-top:calc(env(safe-area-inset-top) + 22px)!important;text-align:center}

.pkg{margin-top:34px;padding:clamp(26px,6vw,40px) clamp(20px,5vw,36px);background:#F2EBDE;background-image:var(--grain);background-size:400px;color:#2A1D0F;text-align:left;position:relative;border:1px solid rgba(242,235,222,.9);box-shadow:0 22px 40px -24px rgba(0,0,0,.65)}

    '<h3>Talk it through with Fahad</h3><p class="lead" style="max-width:26em;margin-left:auto;margin-right:auto">A free planning call. No pressure, no pitch deck. We’ll fit this plan to your actual weddings.</p>'+
    '<button class="btn" type="button" id="book">Book a free planning call with Fahad <svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button>'+
    (A.decide==='parents'?'<p class="bring">Your parents are welcome on the call too.</p>':'')+
    '<a class="lk alt-lk" data-t="See the full packages" href="'+CONFIG.packagesUrl+'" target="_blank" rel="noopener"><span>See the full packages</span></a>'+
    '<p class="fine2"><button class="lk" type="button" id="redo" data-t="Start over"><span>Start over</span></button></p></div></section>'+
  '<div class="sticky" id="sticky"><div><div class="p1">'+R.pkg.name+' · '+fmt(R.pkg.price)+'</div><div class="p2">Free call with Fahad</div></div><button class="btn" type="button" id="book2">Book a call</button></div>';
  main.appendChild(s);
  track('ViewContent',{content_name:R.pkg.name,value:R.pkg.price,currency:cur,lead_tag:R.tag});
  track('Lead',{content_name:R.pkg.name,value:R.pkg.price,currency:cur,lead_tag:R.tag});
  var book=function(){bookCall(R)};
  $('#book').onclick=book;$('#book2').onclick=book;
  $('#redo').onclick=function(){A={};prog.innerHTML='';showIntro()};
  /* reveal + sticky bar */
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('seen');io.unobserve(e.target)}})},{rootMargin:'0px 0px -8% 0px',threshold:.05});
  document.querySelectorAll('.rv-in').forEach(function(n){io.observe(n)});
  var st=$('#sticky'),callEl=$('#call');
  var io2=new IntersectionObserver(function(es){st.classList.toggle('show',window.scrollY>400&&!es[0].isIntersecting)});
  io2.observe(callEl);
  addEventListener('scroll',function(){if(step===9)st.classList.toggle('show',window.scrollY>400&&callEl.getBoundingClientRect().top>innerHeight)},{passive:true});
}

/* ---------- BOOKING ---------- */
function planFields(R){
  var ev=(A.events||[]).map(function(id){return EVENTS.filter(function(e){return e.id===id})[0].short}).join(', ');
  var g=function(id){var o=A[id]!=null&&optOf(id);return o?o.l:''};
  return{lead_tag:R.tag,package:R.pkg.name,hours:R.pkg.hours,price:R.pkg.price,currency:R.usd?'USD':'CAD',events:ev,days:A.days,guests:g('guests'),
    location:g('where'),date_band:g('when'),priority:g('matters'),worry:g('worry'),budget:g('budget'),deciders:g('decide'),travel:R.travel?'yes':'no'};
}
function bookCall(R){
  var f=planFields(R);
  track('Schedule',{content_name:R.pkg.name,lead_tag:R.tag});
  if(CONFIG.bookingUrl){
    var u=new URL(CONFIG.bookingUrl);
    Object.keys(f).forEach(function(k){u.searchParams.set(k,f[k])});
    location.href=u.toString();
  }else{
    var body='Hi Fahad,%0D%0A%0D%0AI took the quiz and would like a free planning call.%0D%0A%0D%0A'+Object.keys(f).map(function(k){return encodeURIComponent(k+': '+f[k])}).join('%0D%0A');
    location.href='mailto:'+CONFIG.fallbackEmail+'?subject='+encodeURIComponent('Planning call: '+R.pkg.name)+'&body='+body;
  }
}

showIntro();
</script>
