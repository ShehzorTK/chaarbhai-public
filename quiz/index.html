.btn{transition:transform .25s var(--ease),opacity .25s}

</style></head><body><div class="previewbar">Your wedding plan<button id="restart">Start over</button></div><main id="app"></main><div id="toast" class="toast hide" role="status"></div><div id="modal-root"></div><noscript>This quiz needs JavaScript enabled. Open this HTML in Safari or Chrome.</noscript>
<script src="/quiz/capture.js"></script>
<script id="quiz-engine">
const opt=(id,label,reply='')=>({id,label,reply});
const data=[
{id:'q1',chapter:0,num:'Q1',title:'Where are we celebrating?',kind:'single',options:[opt('gta','Toronto / GTA','Home turf. We know the banquet halls.'),opt('ont','Elsewhere in Ontario','Worth the drive.'),opt('can','Elsewhere in Canada',"Let’s see where we’re headed."),opt('us','USA',"We’ll keep the currency and travel clear."),opt('other','Somewhere else','Tell us where the celebration takes us.')],why:'Sets the travel context and price currency. No assumption about their culture or ceremony.',effect:'Canada → CAD. USA → USD. Other destinations → confirm currency and travel on the call.'},
{id:'city',chapter:0,num:'↳',title:'Which city?',kind:'text',parent:'q1',condition:'If the wedding is outside Toronto / GTA',trigger:a=>!!a.q1&&a.q1!=='gta',reply:'Noted. Travel will be separate from coverage.',why:'Ask only when a city is needed to discuss travel. “Not decided yet” is a valid answer.',effect:'Add city and unresolved travel details to the plan. Do not calculate an invented travel fee.'},
{id:'q2',chapter:0,num:'Q2',title:'When’s the wedding?',kind:'single',options:[opt('soon','Within 3 months',"Soon, then. Let’s get the essentials sorted."),opt('mid','3–6 months','Plenty we can figure out together.'),opt('later','6–12 months','Time to make a plan that feels like you.'),opt('far','More than a year','Time to make a plan that feels like you.'),opt('none','No date yet','Dreaming counts as planning.')],why:'Reflects the buying window in the newer customer avatars. A close date is a planning detail, not a reason to invent scarcity.',effect:'Near date → prioritize confirming dates and the essentials. No date → exploratory guidance. Availability is always unconfirmed.'},
{id:'q3',chapter:0,num:'Q3',title:'What have you figured out so far?',kind:'multi',options:[opt('date','Date'),opt('venue','Venue'),opt('schedule','Event schedule'),opt('planner','Planner'),opt('none','Still figuring it out')],exclusive:['none'],reply:a=>(a.q3||[]).includes('none')?'You don’t need all the answers yet.':'A few pieces in place. Let’s build around them.',why:'Avoid asking for details they don’t have. No extra question is triggered solely by planning stage.',effect:'List unknown details in the result as things to work through with Fahad.'},
{id:'q4',chapter:0,num:'Q4',title:'Which events would you like covered?',kind:'multi',options:['E-shoot','Mehndi','Dholki','Maiyan','Jaggo','Sangeet','Haldi','Gaye holud','Nikkah','Anand Karaj','Pheras','Church ceremony','Baraat','Rukhsati / Vidaai','Walima','Reception','Other event','Help me decide'].map((x,i)=>opt('e'+i,x)),exclusive:['e17'],reply:a=>{let n=(a.q4||[]).length;return (a.q4||[]).includes('e17')?'We’ll start with what you know.':n===1?'One celebration. Let’s give it proper attention.':n===2?'Two chapters of the same story.':'A whole wedding season. Let’s map it out.'},why:'Use the couple’s actual event names. Do not infer a religion or label all ceremonies “Nikkah.” Help me decide is exclusive; Other event may be selected alongside named events.',effect:'These events populate the coverage screen, the memory follow-up, and the result. An e-shoot is a separate session, not automatically another wedding day.'},
{id:'q5',chapter:0,num:'Q5',title:'How are your events spread out?',kind:'schedule',reply:'We’ll account for the moving around, too.',why:'Two compact fields on one screen. Number of days alone does not determine a package.',effect:'Record days and locations. Travel between venues, overlap, and unknown timings remain explicit planning assumptions.'},
{id:'q6',chapter:0,num:'Q6',title:'How much of each event would you like captured?',kind:'coverage',reply:'We can shape the hours around what matters.',why:'Show only their selected events. For each: key moments, whole event, or help me decide; optional estimated duration. This is one screen with several rows, not one tap.',effect:'Build an event-by-event coverage brief. “Whole event” without a duration is not enough to issue a precise hours estimate. If no events are known, show one broad preference row.'},
{id:'q7',chapter:0,num:'Q7',title:'How many guests at your biggest event?',kind:'single',options:[opt('small','Under 100','A smaller room, full of your people.'),opt('medium','100–250','A full room. Plenty of familiar faces.'),opt('large','250–400',"Let’s make room in the plan for your people."),opt('huge','400+',"Let’s make room in the plan for your people."),opt('unsure','Unsure','A rough idea is enough for now.')],why:'Ask about the biggest event, not a combined count across several events.',effect:'Informs family-photo logistics and planning questions. Guest count alone should not add arbitrary coverage hours.'},
{id:'q8',chapter:1,num:'Q8',title:'How do you two feel about being photographed?',kind:'multi',options:[opt('ready','Ready for our magazine cover'),opt('direction','Fine with a little direction'),opt('hands','We forget what to do with our hands'),opt('partner','One of us needs convincing')],reply:a=>(a.q8||[]).some(x=>['hands','partner'].includes(x))?'That’s our department. You just bring yourselves.':'A little direction, room to be yourselves.',why:'Multiple answers can represent different comfort levels between partners.',effect:'Camera shyness affects the suggested approach and reassurance. It never automatically increases the package price.'},
{id:'comfort',chapter:1,num:'↳',title:'What would make it easier?',kind:'multi',parent:'q8',condition:'If either partner is camera shy or needs convincing',trigger:a=>(a.q8||[]).some(x=>['hands','partner'].includes(x)),options:[opt('direct','Tell us what to do'),opt('private','Keep it private, away from guests'),opt('short','Keep portraits short'),opt('candid','Mostly candid moments'),opt('unsure','Help us figure it out')],exclusive:['unsure'],reply:'Noted. We’ll build that into your plan.',why:'One follow-up for both partners. No repeated comfort question later.',effect:'Private → suggest a quiet portrait location. Short → suggest a brief portrait block. Direction → gentle guidance. Candid → less interruption.'},
{id:'q10',chapter:1,num:'Q10',title:'Years from now, what would you love to relive?',kind:'multi',options:[opt('people','Our people and their reactions'),opt('words','The words and emotion'),opt('party','The party and atmosphere'),opt('couple','The two of us together'),opt('unsure','Help us decide')],exclusive:['unsure'],reply:a=>(a.q10||[]).includes('unsure')?'That’s okay. Your examples will help us explore it.':'Let’s make room for those memories.',why:'Choose up to two. Both selections feed one combined follow-up, not two separate branches.',effect:'The priorities shape the personal opener, suggested coverage emphasis, and work shown.'},
{id:'protect',chapter:1,num:'↳',title:'Which of these events or moments matter most to you?',kind:'multi',parent:'q10',condition:'If they chose a memory priority; skip “Help us decide”',trigger:a=>(a.q10||[]).some(x=>x!=='unsure'),optionsFor:a=>{let out=[];for(const p of a.q10||[]){if(p==='people')out.push(...['Parents','Grandparents','Siblings','Chosen family','Everyone together'].map((s,i)=>opt('people'+i,s)));if(p==='words')out.push(...['Vows','Speeches','Family messages','Ceremony'].map((s,i)=>opt('words'+i,s)));if(p==='party')out.push(...eventOpts(a).map(e=>opt('party_'+e.id,e.label)),opt('dancing','Late-night dancing'));if(p==='couple')out.push(...['A few beautiful photos','A relaxed session together','Time to make something special'].map((s,i)=>opt('couple'+i,s)));}return out;},reply:'Those are the moments we’ll plan around.',why:'Options are combined from the priorities above. Optional names belong in the real quiz; this tool avoids collecting personal details.',effect:'Create a must-have people / moments section. If their priorities conflict with short coverage, flag the trade-off rather than silently dropping something.'},
{id:'q11',chapter:1,num:'Q11',title:'What’s been hardest about choosing a team?',kind:'multi',options:[opt('comfort','Feeling comfortable'),opt('people','Trusting them to capture our people'),opt('style','Finding our editing style'),opt('pricing','Understanding prices and extras'),opt('coverage','Knowing how much coverage we need'),opt('none','Nothing yet — we’re exploring')],exclusive:['none'],reply:a=>{let l=labels('q11',a);return l.length===1&&a.q11[0]==='none'?'A good place to start. Let’s make it clearer.':l.length>1?'A few things to get right. We’ve noted each one.':'Got it. Let’s make that clearer.'},why:'Select all that apply. Ask at most one unanswered concern follow-up. Everything selected still gets addressed in the result.',effect:'Check earlier answers first. For this draft, follow-up priority is: coverage → pricing → comfort → people → style. This rule is visible and can be revised.'},
{id:'concern',chapter:1,num:'↳',title:'One concern, a little deeper',kind:'multi',parent:'q11',condition:'Only when a selected concern is still unexplained; at most one',trigger:a=>!!unresolved(a),optionsFor:a=>concernOptions(unresolved(a)),titleFor:a=>({coverage:'What would you regret missing?',pricing:'What feels unclear about the price?',comfort:'What would help you relax?',people:'Who needs special attention?',style:'What puts you off in wedding edits?'}[unresolved(a)]||'One concern, a little deeper'),reply:'Helpful. We’ll address that in your plan.',why:'Only one follow-up is chosen. Earlier comfort, people, and style answers suppress repeat questions. Other selected concerns stay in the consultation brief.',effect:'Add concrete reassurance and a useful next step. No unverified guarantees about turnaround, availability, team continuity, or capturing every person.'},
{id:'q12',chapter:2,num:'Q12',title:'What budget feels comfortable for photo and film together?',kind:'single',options:[opt('low','Under $3,300'),opt('b1','$3,300–$4,500'),opt('b2','$4,500–$6,500'),opt('b3','$6,500–$9,000'),opt('b4','$9,000 or more'),opt('unsure','Not sure — help me understand the costs')],reply:'Got it. Let’s see how the coverage fits.',why:'Amounts are draft bands using the existing quiz as reference. Live package pricing, tax, currency and travel treatment must be verified before implementation.',effect:'A real coverage / pricing calculation determines budget fit. This review tool lets you simulate that decision below without pretending to quote a wedding.'},
{id:'trade',chapter:2,num:'↳',title:'What would you rather protect?',kind:'single',parent:'q12',condition:'If requested coverage exceeds their budget',trigger:a=>!!a.q12&&a.q12!=='unsure'&&plan(a).fit==='gap',options:[opt('all','Key moments at every event',"We’ll explore shorter coverage across your events."),opt('priority','Fuller coverage at our most important event',"We’ll start there and show what stays outside coverage."),opt('full','Show the fuller plan and the price difference',"You’ll see the fuller option and the difference clearly."),opt('help','Help us decide together',"We’ll show the options to talk through with Fahad.")],why:'Ask which event on the same screen if they prioritize one event. Never claim the smaller package includes everything.',effect:'Show explicit included / excluded moments and any scheduling constraints. If no workable option fits, say so and keep the conversation open.'},
{id:'result',chapter:2,num:'✓',title:'Your personalized starting plan',kind:'result',why:'A starting plan for a consultation, not a confirmed booking or final quote.',effect:'Explain coverage by event, why it fits, assumptions, trade-offs, relevant work, and the questions to resolve with Fahad.'}
];

const chapters=[{title:'Your wedding',message:'We’ve got the wedding basics. Now, the two of you.',note:'A little about your people, your memories, and how you feel in front of the camera.'},{title:'Your people & memories',message:'Your plan is taking shape.',note:'One budget question next. We may ask one follow-up to help it fit.'},{title:'Your plan',message:'Here’s how your answers come together.',note:'A starting point for a conversation, shaped around your wedding.'}];
const packages=[{name:'First Light',hours:6,price:3300},{name:'Golden Hour',hours:10,price:5500},{name:'Till Dusk',hours:16,price:8800},{name:'Till Sunrise',hours:24,price:12600}];
function get(id){return data.find(q=>q.id===id)}
function options(q,a){return q.optionsFor?q.optionsFor(a):q.options||[]}
function labels(id,a){const q=get(id),v=a[id];if(!q)return [];return options(q,a).filter(o=>Array.isArray(v)?v.includes(o.id):v===o.id).map(o=>o.label)}
function eventOpts(a){return get('q4').options.filter(o=>(a.q4||[]).includes(o.id)&&o.id!=='e17')}
function unresolved(a){const s=a.q11||[];if(s.includes('coverage')&&!allHoursKnown(a))return'coverage';if(s.includes('pricing'))return'pricing';if(s.includes('comfort')&&!(a.comfort||[]).some(x=>x!=='unsure'))return'comfort';if(s.includes('people')&&!(a.protect||[]).some(x=>x.startsWith('people')))return'people';if(s.includes('style'))return'style';return null}
function concernOptions(t){return ({coverage:['Getting ready','Ceremony','Family time','Portraits','Speeches','Late-night dancing','Not sure yet'],pricing:['What’s included','Tax and travel','Extra hours','Photo and film together','All of the above'],comfort:['Gentle direction','A private location','Short portraits','Mostly candid moments','Help us decide'],people:['Parents','Grandparents','Siblings','Chosen family','Everyone together'],style:['Heavy filters','Overly posed photos','Edits that feel dated','I’d like to talk it through']}[t]||[]).map((s,i)=>opt('c'+i,s))}
function allHoursKnown(a){const ev=eventOpts(a);return ev.length>0&&ev.every(e=>!!duration(a.durations?.[e.id]))}
function duration(s){return ({'Up to 2 hours':[1,2],'1–2 hours':[1,2],'3–4 hours':[3,4],'5–6 hours':[5,6],'7–8 hours':[7,8]})[s]||null}
function plan(a){const ev=eventOpts(a);let lo=0,hi=0;for(const e of ev){let d=duration(a.durations?.[e.id]);if(d){lo+=d[0];hi+=d[1]}}const complete=allHoursKnown(a),pkg=complete?packages.find(p=>p.hours>=hi)||null:null;const ceiling=({low:3299,b1:4500,b2:6500,b3:9000})[a.q12];let fit='unknown';if(a.q12==='unsure')fit='open';else if(pkg&&ceiling!=null)fit=pkg.price>ceiling?'gap':'fits';else if(a.q12==='low')fit='gap';else if(a.q12==='b4'&&pkg)fit=pkg.price<=9000?'fits':'confirm';if(complete&&!pkg)fit='custom';return{complete,hoursMin:lo,hoursMax:hi,package:pkg,fit,events:ev,currency:a.q1==='us'?'USD':a.q1==='other'?'Confirm currency':'CAD',travel:a.q1!=='gta',ceiling}}
function route(a){return data.filter(q=>!q.parent||q.trigger(a)).map(q=>q.id)}
function prune(a){delete a.q9;for(const q of data.filter(x=>x.parent))if(!q.trigger(a))delete a[q.id];if(a.protect){let valid=options(get('protect'),a).map(x=>x.id);a.protect=a.protect.filter(x=>valid.includes(x));if(!a.protect.length)delete a.protect}const ev=eventOpts(a).map(e=>e.id);for(const key of ['q6','durations'])if(a[key])for(const id of Object.keys(a[key]))if(!ev.includes(id)&&id!=='unknown')delete a[key][id];if(a.priority&&!ev.includes(a.priority)&&a.priority!=='help')delete a.priority;const t=unresolved(a);if(a.concernType&&a.concernType!==t)delete a.concern;a.concernType=t;}
function valid(q,a){const v=a[q.id];if(q.id==='city')return !!v?.trim();if(q.kind==='schedule')return !!v?.days&&!!v?.locations;if(q.kind==='coverage'){const ev=eventOpts(a);return ev.length?ev.every(e=>!!v?.[e.id]&&!!a.durations?.[e.id]):!!v?.unknown}if(q.kind==='result')return true;if(q.id==='trade'&&v==='priority'&&!a.priority)return false;return Array.isArray(v)?v.length>0:!!v}
var QuizEngine={route,plan,prune,concern:unresolved,question:get};
</script>
<script>
const ASSETS={"fahad":"/quiz/approved/asset-4.webp","candid": "/quiz/approved/asset-5.webp", "editorial": "/quiz/approved/asset-6.webp", "romantic": "/quiz/approved/asset-7.webp", "family": "/quiz/approved/asset-8.webp", "party": "/quiz/approved/asset-9.webp", "hero": "/quiz/approved/asset-10.jpg", "logo": "/quiz/approved/asset-11.png", "logolight": "/quiz/approved/asset-12.png"};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let a={},current='intro',editing=false,editRoot=null,busy=false,transitionTo=null,reactionTimer;
const storageKey='cb-quiz-plan-v2';
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved?.answers&&typeof saved.answers==='object'){a=saved.answers;prune(a)}}catch{}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({answers:a}))}catch{}}
function title(q){return q.titleFor?q.titleFor(a):q.title}
function currency(){return a.q1==='us'?'USD':a.q1==='other'?'currency to confirm':'CAD'}
function logo(light=false){return `<img class="brand" src="${ASSETS[light?'logolight':'logo']}" alt="Chaar Bhai">`}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hide');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hide'),2600)}
function go(id){clearTimeout(reactionTimer);busy=false;current=id;render();window.scrollTo({top:0,behavior:'instant'});const heading=$('#heading');if(heading)heading.focus({preventScroll:true})}
function header(){return `<div class="shell"><header class="header">${logo()}<span class="tiny">Wedding photo & film</span></header></div>`}
function intro(){const has=Object.keys(a).some(k=>/^q\d/.test(k));$('#app').innerHTML=`<section class="original-intro"><div class="intro-bar">${logo(true)}</div><div class="intro-photo"><div class="photo-frame"><img src="${ASSETS.hero}" alt="Almirah and Ijaz smiling as they walk through their guests and sparklers" fetchpriority="high"></div></div><div class="intro-copy"><h1>How many hours of photo and film does your wedding actually need?</h1><p>Tell us about your wedding. We’ll put together a coverage plan that feels like you.</p><button class="btn" id="start">Find out what I need <span aria-hidden="true">→</span></button><div class="intro-fine">Free. Just taps. Made around your wedding.</div>${has?'<div class="resume-links"><button class="link" id="resume">Continue my plan →</button><button class="link" id="fresh">Start fresh</button></div>':''}</div></section>`;$('#start').onclick=()=>go('q1');if($('#resume'))$('#resume').onclick=()=>go(route(a).find(id=>id!=='result'&&!valid(get(id),a))||'result');if($('#fresh'))$('#fresh').onclick=restart}

function progress(q){if(q.id==='trade')return'Last question — then your plan.';if(q.id==='q12')return'1–2 questions left. We’ll help with any trade-offs.';if(q.id==='concern'||q.id==='q11')return'Your plan is taking shape. Budget comes next.';return q.chapter===0?'Start with what you know. We’ll help with the rest.':'A little more about the two of you.'}
function selected(q,id){let v=a[q.id];return Array.isArray(v)?v.includes(id):v===id}
function optionsHTML(q){return `<div class="options ${q.id==='q4'?'event-grid':''} ${q.kind==='single'?'single':''}" role="group" aria-label="${esc(title(q))}">${options(q,a).map((o,i)=>`<button class="option ${selected(q,o.id)?'checked':''}" data-option="${o.id}" type="button" aria-pressed="${selected(q,o.id)}"><span class="marker" aria-hidden="true">${q.kind==='single'?String.fromCharCode(97+i):selected(q,o.id)?'✓':''}</span><span class="option-label">${esc(o.label)}</span></button>`).join('')}</div>`}
function dropdown(name,label,list,value){return `<label class="field-label">${label}<select class="field" data-field="${name}"><option value="">Choose…</option>${list.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
function questionHTML(q){if(q.id==='city')return `<label class="field-label">Wedding city<input class="field" id="city" placeholder="e.g. Chicago" autocomplete="address-level2" value="${esc(a.city==='Not decided yet'?'':a.city||'')}"></label><button class="option ${a.city==='Not decided yet'?'checked':''}" id="city-unsure" aria-pressed="${a.city==='Not decided yet'}"><span class="marker">${a.city==='Not decided yet'?'✓':''}</span>Not decided yet</button>`;
if(q.kind==='schedule')return `<div class="two-col">${dropdown('days','How many days?',['One day','Two days','Three days','Four or more days','Unsure'],a.q5?.days)}${dropdown('locations','How many locations?',['One location','Several locations','Undecided'],a.q5?.locations)}</div>`;
if(q.kind==='coverage'){const ev=eventOpts(a);if(!ev.length)return dropdown('unknown','We’re still deciding on events. We’d like…',['Key moments','Fuller coverage','Help me decide'],a.q6?.unknown);return ev.map(e=>`<section class="coverage-item"><h3>${esc(e.label)}</h3><div class="two-col">${dropdown('scope:'+e.id,'What would you like covered?',['Key moments','Whole event','Help me decide'],a.q6?.[e.id])}${dropdown('duration:'+e.id,'How long would you like us there?',['Up to 2 hours','3–4 hours','5–6 hours','7–8 hours','More than 8 hours','Not sure yet'],a.durations?.[e.id])}</div></section>`).join('')}

let html=optionsHTML(q);if(q.id==='q4'&&(a.q4||[]).includes('e16'))html+=`<label class="field-label" style="margin-top:20px">What do you call your other event? <span>Optional</span><input class="field" id="otherEvent" value="${esc(a.otherEvent||'')}" placeholder="Your event name" maxlength="80"></label>`;
if(q.id==='trade'&&a.trade==='priority')html+=dropdown('priority','Which event would you protect?',[...eventOpts(a).map(e=>e.label),'Help us choose on the call'],a.priorityLabel);
if(q.id==='q12')html+=`<p class="small-note">Travel, if needed, is quoted separately.</p>`;return html}
function hint(q){if(q.kind==='multi')return q.max?'Pick up to '+q.max+'. Choose what feels like you.':'Select all that apply. More than one is welcome.';if(q.kind==='coverage')return'Choose a starting point for each event. “Not sure yet” is always okay.';if(q.kind==='schedule')return'Even a rough idea helps.';if(q.id==='city')return'It helps us plan the getting-there part.';if(q.id==='q12')return'So the plan starts with what feels comfortable for you.';return'Tap the answer that fits best.'}
function renderQuestion(q){const rt=route(a),ix=rt.indexOf(q.id),status=q.id==='trade'?'Last one!':q.id==='q12'?'Almost there':q.id==='q11'||q.id==='concern'?'Nearly there':(q.chapter+1)+' / 3';const help=q.kind==='multi'?(q.max?'Pick up to '+q.max+'.':'Pick every one that applies.'):q.kind==='coverage'?'A rough idea is fine.':q.id==='q12'?'For photo and film together · '+currency():'';const auto=q.kind==='single'&&!(q.id==='trade'&&a.trade==='priority');$('#app').innerHTML=`<div class="quiz-shell"><header class="quiz-header"><button class="back" id="back">← Back</button>${logo(q.chapter>0)}<span class="tiny" id="status">${status}</span><div class="quiet-progress" role="progressbar" aria-label="${esc(chapters[q.chapter].title)}" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${q.chapter+1}">${chapters.map((c,i)=>`<i class="${i<=q.chapter?'on':''}"></i>`).join('')}</div><p class="quiet-ledger">${esc(chapters[q.chapter].title)}</p></header><section class="question"><h2 id="heading" tabindex="-1">${esc(title(q))}</h2>${help?`<p class="hint">${help}</p>`:''}<div id="choices">${questionHTML(q)}</div><p class="error hide" id="error" role="alert"></p><div class="reaction hidden" id="reaction" role="status" aria-live="polite"></div><div class="actions ${auto?'auto-actions':''}"><span class="selection-count" id="selectionCount">${q.kind==='multi'?selectionText(q):''}</span><button class="btn" id="continue" ${valid(q,a)?'':'disabled'}>${editing?'Update my plan':'Continue'} <span aria-hidden="true">→</span></button></div></section></div>`;
$('#back').onclick=()=>{if(editing){editing=false;go('result')}else go(ix>0?rt[ix-1]:'intro')};bindQuestion(q);$('#continue').onclick=()=>advance(q)}

function selectionText(q){if(q.kind==='multi'){let n=(a[q.id]||[]).length;return q.max?n+' of '+q.max+' selected':n?n+' selected':'Choose what applies'}return q.id==='trade'?'One decision, then your plan.':'No perfect answers needed.'}
function sync(q){$('#continue').disabled=!valid(q,a);$('#selectionCount').textContent=q.kind==='multi'?selectionText(q):'';$('#error').classList.add('hide');save()}
function bindQuestion(q){$('#choices').querySelectorAll('[data-option]').forEach(btn=>btn.onclick=()=>{if(busy)return;const id=btn.dataset.option;if(q.id==='concern'){q.exclusive=options(q,a).filter(o=>['All of the above','Not sure yet','Help us decide'].includes(o.label)).map(o=>o.id)}if(q.kind==='multi'){let v=a[q.id]||[];if(v.includes(id))v=v.filter(x=>x!==id);else if(q.exclusive?.includes(id))v=[id];else{v=v.filter(x=>!q.exclusive?.includes(x));if(q.max&&v.length>=q.max){toast('Pick up to '+q.max+'. Unselect one to choose another.');return}v.push(id)}a[q.id]=v}else a[q.id]=id;prune(a);save();const y=window.scrollY;renderQuestion(q);$('.question').style.animation='none';window.scrollTo(0,y);if(q.kind==='single'&&valid(q,a))advance(q)});

 for(const q of data.filter(q=>q.kind!=='result'&&(!q.parent||q.trigger(a)))){

 return {summary:resultIntro().text,package:p.package?.name||'Timings and coverage to discuss',hours:p.complete?p.hoursMax:null,price:p.package?.price||null,currency:p.currency,budget_fit:p.fit,location:labels('q1',a).join(', ')+(a.city?' · '+a.city:''),date_band:labels('q2',a).join(', '),events:eventOpts(a).map(eventName).join(', '),days:a.q5?.days,guests:labels('q7',a).join(', '),budget:labels('q12',a).join(', '),priority:labels('q10',a).join(', '),worry:labels('q11',a).join(', '),coverage_brief:Object.entries(brief).map(([q,v])=>q+'\n'+(v||'To discuss')).join('\n\n'),assumptions:'Starting plan only. Availability, timings, overlap, tax and travel must be confirmed.'};

function ensureCapture(){

function saveQuiz(state){

 if(!window.CBLeadCapture){if(note)note.textContent='The inquiry service could not load. Refresh or email us.';return}

 openModal(`<p class="eyebrow">Your wedding plan</p><h2 id="modalTitle">${intent==='consultation'?'Request a planning call.':'Email me this plan.'}</h2><p>Fahad will review your answers and email you within 24 hours. ${intent==='consultation'?'We’ll arrange a free planning call; no appointment is reserved yet.':'Your plan and relevant pricing will come by email.'}</p><form id="bookingForm"><label class="field-label">Your name<input class="field" name="name" autocomplete="name" required maxlength="160"></label><label class="field-label">Email<input name="email" type="email" class="field" autocomplete="email" required maxlength="254"></label><label class="field-label">Phone <span>Optional</span><input name="phone" type="tel" class="field" autocomplete="tel" maxlength="80"></label><button class="btn" type="submit">Send my request <span>→</span></button><p id="contact-status" role="status" aria-live="polite"></p></form><p class="fine">Prefer email? <a href="mailto:info@chaarbhai.com">info@chaarbhai.com</a></p>`);
