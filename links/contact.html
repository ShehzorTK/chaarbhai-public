<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Check your date · Chaar Bhai</title>
<meta name="theme-color" content="#2B2530">
<style>
@font-face{font-family:'Cormorant Garamond';font-weight:500;src:url(cormorant-garamond.woff2) format('woff2');font-display:swap}
@font-face{font-family:'EB Garamond';font-weight:400;src:url(eb-garamond.woff2) format('woff2');font-display:swap}
@font-face{font-family:'EB Garamond';font-style:italic;font-weight:400;src:url(eb-garamond-italic.woff2) format('woff2');font-display:swap}
:root{color-scheme:dark;--aub:#2B2530;
  --cream:#F2EBDE;--brown:#2A1D0F;--tan:#D2B6A1;
  --f-display:'Cormorant Garamond','Cochin',Georgia,serif;
  --f-serif:'EB Garamond','Sirenne',Georgia,serif;
  --pad:clamp(18px,5.5vw,32px);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n' x='0' y='0'><feTurbulence type='fractalNoise' baseFrequency='.8 .55' numOctaves='4' seed='4'/><feColorMatrix values='0 0 0 0 .16 0 0 0 0 .11 0 0 0 0 .06 0 0 0 .4 -.14'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;background:var(--aub)}
body{font-family:var(--f-serif);font-size:17px;line-height:1.5;letter-spacing:.02em;color:var(--cream);background:var(--aub) var(--grain);background-size:400px;min-height:100svh}
a{color:inherit;-webkit-tap-highlight-color:transparent}
a:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) var(--pad) calc(36px + env(safe-area-inset-bottom))}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
header{text-align:center;padding:10px 8px 26px}
header img{height:46px;width:auto;display:block;margin:0 auto 22px}
h1{font-family:var(--f-display);font-weight:500;text-transform:uppercase;letter-spacing:.02em;line-height:1;font-size:clamp(30px,9vw,42px)}
header p{margin:12px auto 0;font-style:italic;font-size:18px;line-height:1.45;max-width:34ch;text-wrap:balance}
.rule{height:1px;background:rgba(242,235,222,.25);margin:0 0 6px}
/* color-scheme matches the form's own page (light): when an iframe's scheme differs from the dark page, browsers paint a white backdrop behind it */
#form{display:block;width:100%;min-height:760px;border:0;background:transparent;color-scheme:light}
.alt{margin-top:22px;text-align:center;font-style:italic;font-size:16px;color:rgba(242,235,222,.85)}
.alt a{text-decoration:underline;text-underline-offset:3px}
</style></head>
<body><main class="wrap">
<a class="back" href="https://links.chaarbhai.com"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>Back</a>
<header>
  <img src="logo-beige.png" alt="Chaar Bhai">
  <h1>Check your date</h1>
  <p>Tell us about your wedding. We usually reply within a day or two.</p>
</header>
<div class="rule"></div>
<iframe id="form" title="Enquiry form" src="https://app.studioninja.co/contactform/parser/0a800fc8-7cc8-186f-817c-e0d40ca12ec6/0a800fc8-86e5-1a1e-8186-ee1ec0214c29" allowfullscreen></iframe>
<p class="alt">Prefer email? <a href="mailto:info@chaarbhai.com">info@chaarbhai.com</a></p>
</main>
<script src="https://app.studioninja.co/client-assets/form-render/assets/scripts/iframeResizer.js"></script>
<script>/* Not the Golden Hour landing page: clear its ad flag so an enquiry from here is not counted as an ad lead (see thanks.html) */if(/(^|\.)chaarbhai\.com$/.test(location.hostname))document.cookie='cb_gh=; Domain=.chaarbhai.com; Path=/; Max-Age=0; SameSite=Lax; Secure';</script>
<script>if(window.iFrameResize)iFrameResize({log:false,minHeight:320},"#form")</script>
</body></html>
