<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>Instagram Carousel Prototype</title>
<style>
/* Layout: a phone-width Instagram feed post on black, centred; the carousel is the page. */
:root{--bg:#000;--fg:#f5f5f5;--mute:#a8a8a8;--line:#262626;--dot:#4d4d4d;--dotOn:#f5f5f5;--chip:rgba(26,26,26,.82);--aub:#2B2530;color-scheme:dark;
 --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--ui);margin:0;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.post{width:100%;max-width:430px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:8px 4px 10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--aub);flex:none;overflow:hidden}
.av img{width:100%;height:100%;display:block}
.who{min-width:0;flex:1}
.who b{font-weight:600;font-size:14px;display:block}
.who span{font-size:12px;color:var(--mute)}
.more{display:flex;gap:3px}
.more i{width:4px;height:4px;border-radius:50%;background:var(--fg)}
.car{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;border-radius:0}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;aspect-ratio:3/4;object-fit:cover;scroll-snap-align:start;display:block;-webkit-user-drag:none;user-select:none}
.count{position:absolute;top:12px;right:12px;background:var(--chip);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:14px;font-variant-numeric:tabular-nums}
.nav{position:absolute;top:50%;translate:0 -50%;width:26px;height:26px;border-radius:50%;border:0;background:rgba(245,245,245,.78);color:#262626;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s}
.car:hover .nav,.nav:focus-visible{opacity:1}
.nav svg{width:14px;height:14px;stroke-width:2.4}
.nav[hidden]{display:none}
.nav.l{left:8px}.nav.r{right:8px}
.nav:focus-visible,.act button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 4px 4px}
.act{display:flex;gap:14px}
.act button{background:none;border:0;color:var(--fg);padding:0;cursor:pointer;display:grid}
.act.r{justify-content:flex-end}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dots{display:flex;gap:4px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--dot);transition:background .15s}
.dots i.on{background:var(--dotOn)}
.cap{padding:6px 4px 0;font-size:14px}
.cap b{font-weight:600}
.cap p{margin:0;white-space:pre-line}
.cap .kw{color:var(--mute)}
.meta{color:var(--mute);font-size:12px;padding:6px 4px 0}
.note{margin:22px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--mute);font-size:12px;line-height:1.5}
@media (hover:none){.nav{display:none}}
@media (prefers-reduced-motion:reduce){.nav,.dots i{transition:none}.track{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="post">
 <header>
  <div class="av"><img src="avatar.png" alt=""></div>
  <div class="who"><b>chaarbhai</b></div>
  <div class="more" aria-hidden="true"><i></i><i></i><i></i></div>
 </header>
 <div class="car" id="car">
  <div class="track" id="track" tabindex="0" aria-label="Carousel, 10 photos. Swipe or use arrow keys."></div>
  <div class="count" id="count">1/10</div>
  <button class="nav l" id="prev" aria-label="Previous photo" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="nav r" id="next" aria-label="Next photo"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
 </div>
 <div class="bar">
  <div class="act">
   <button aria-label="Like"><svg viewBox="0 0 24 24"><path d="M12 20.5s-8-4.7-8-10.6A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.9c0 5.9-8 10.6-8 10.6z"/></svg></button>
   <button aria-label="Comment"><svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-3.4-6.8l3.4-.4-.9 3.5A8.5 8.5 0 0 1 20.5 12z"/></svg></button>
   <button aria-label="Share"><svg viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4 18-7z"/></svg></button>
  </div>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <div class="act r"><button aria-label="Save"><svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4.5-6 4.5z"/></svg></button></div>
 </div>
 <div class="cap"><p id="cap"></p></div>
 <div class="meta">October 2026</div>
 <p class="note">Prototype of the 10-slide carousel as it would appear in the feed, in dark mode at 3:4. Swipe or drag; on a computer, hover for the arrows or press the left and right arrow keys. Account name and date are placeholders; the caption changes with each slide.</p>
</main>
<script>
(function(){
 var N=10,t=document.getElementById('track'),dots=document.getElementById('dots'),c=document.getElementById('count'),p=document.getElementById('prev'),n=document.getElementById('next'),cur=0;
 var alts=['Black and white silhouette of the couple dancing on lakeside rocks under the sun, their names faint in the sky behind them','Black and white portrait of the couple against a bright sky','The couple lying in the grass, foreheads touching','Close-up of her looking up at the camera with a quiet smile','The couple cheek to cheek, smiling at the camera','Two photos of the couple dancing in the lake glare','The couple walking hand in hand across a lawn','Two photos of the couple walking by the lake','The couple nose to nose with the autumn trees behind them','Two black and white photos of the couple by a brick wall'];
 for(var i=1;i<=N;i++){var im=new Image();im.src='slides/s'+String(i).padStart(2,'0')+'.jpg';im.alt=alts[i-1];t.appendChild(im);var d=document.createElement('i');dots.appendChild(d)}

 var main='Nimisha and Naimul\nEngagement photoshoot by the lake\n\nAn autumn afternoon with the bride-to-be and her groom-to-be, walking, dancing and laughing along the water. We shot their engagement session the way we shoot a wedding, candid and documentary, so the portraits feel like the two of them and not a pose.\n\nSwipe through to see it in the order it happened, with a few black and white frames near the end.\n\nIf you are planning a South Asian or Desi wedding and want a photographer and film team who tell the story as it unfolds, that is what we do at Chaar Bhai. Congratulations, Nimisha and Naimul. 🥂';
 var caps=[null,'Quiet, before the day starts moving.','Foreheads together, nothing else to do.','That look right before she laughs.','Cheek to cheek and out of things to say.','Dancing in the glare off the water.','Hand in hand across the lawn.','Slow steps along the lake.','Nose to nose with the trees turning behind them.','And the last two, in black and white, against the brick.'];
 var cap=document.getElementById('cap');
 function setCap(k){cap.textContent='';var b=document.createElement('b');b.textContent='chaarbhai ';cap.appendChild(b);
  if(k===0){cap.appendChild(document.createTextNode(main))}
  else cap.appendChild(document.createTextNode(caps[k]))}
 var ds=dots.children;
 function set(k){cur=k;c.textContent=(k+1)+'/'+N;for(var i=0;i<N;i++)ds[i].className=i===k?'on':'';p.hidden=k===0;n.hidden=k===N-1;setCap(k)}
 function go(k){k=Math.max(0,Math.min(N-1,k));t.scrollTo({left:k*t.clientWidth,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
 t.addEventListener('scroll',function(){var k=Math.round(t.scrollLeft/t.clientWidth);if(k!==cur)set(k)},{passive:true});
 p.onclick=function(){go(cur-1)};n.onclick=function(){go(cur+1)};
 document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
 /* mouse drag */
 var down=false,sx=0,sl=0;
 t.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'){down=true;sx=e.clientX;sl=t.scrollLeft;t.style.scrollSnapType='none'}});
 window.addEventListener('pointermove',function(e){if(down)t.scrollLeft=sl-(e.clientX-sx)});
 window.addEventListener('pointerup',function(){if(down){down=false;t.style.scrollSnapType='';go(Math.round(t.scrollLeft/t.clientWidth))}});
 set(0);
})();
</script>
</body>
</html>
